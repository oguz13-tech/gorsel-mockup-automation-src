name: Factory V3 checkpoint
on:
  push:
    branches: ['feature/petek-v3-*']
  pull_request:
    paths: ['FABRIKA/**', 'tests/test_factory_v3.py', 'scripts/build_windows_factory.py', '.github/workflows/factory-v3-checkpoint.yml']
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest tests.test_factory_v3 -v
      - run: python -B -m compileall -q FABRIKA scripts/build_windows_factory.py
