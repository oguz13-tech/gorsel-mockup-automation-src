name: PETEK V3 source-preserving candidate CI
on:
  pull_request:
    paths:
      - 'SABLON_V2_MIMARI/core/petek_*'
      - 'SABLON_V2_MIMARI/static/js/petek_v3.js'
      - 'SABLON_V2_MIMARI/templates/petek_v3.html'
      - 'tests/test_petek_v3.py'
      - 'scripts/petek_v3_*'
      - 'requirements-petek-v3.txt'
      - '.github/workflows/petek-v3-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local dependencies
        run: python -m pip install -r requirements-petek-v3.txt
      - name: Compile PETEK V3 source modules
        run: python -m compileall -q SABLON_V2_MIMARI/core scripts/petek_v3_windows_launcher.py scripts/petek_v3_windows_release.py
      - name: PETEK V3 unit and isolation tests
        run: python -m pytest -q tests/test_petek_v3.py
      - name: Build immutable Windows candidate ZIP
        if: runner.os == 'Windows'
        run: python scripts/petek_v3_windows_release.py build --destination dist
      - name: Check candidate ZIP content hashes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = (Get-ChildItem dist/*CANDIDATE*.zip | Select-Object -First 1).FullName
          python scripts/petek_v3_windows_release.py inspect "$package"
      - name: Store isolated Windows candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: petek-v3-windows-candidate
          path: dist/*CANDIDATE*.zip
          if-no-files-found: error
