name: V4.4 Group 2 templates and private golden QA gate
on:
  push:
    branches:
      - feature/v44-group2-*
  pull_request:
    paths:
      - 'SABLON_V2_MIMARI/**'
      - 'MERKEZ/PETEK_V3/**'
      - 'TESTLER/test_v44_group2_safe_tools.py'
      - '.github/workflows/v44-group2-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group2:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy==2.4.6 opencv-python-headless==5.0.0.93 pillow openpyxl flask requests
      - name: Compile application and review code
        run: python -m compileall -q -f SABLON_V2_MIMARI MERKEZ/PETEK_V3 TESTLER
      - name: Golden, folder inspector, geometry and source guard regression
        run: python -m pytest -q TESTLER/test_v44_group2_safe_tools.py TESTLER/test_v42_hotfix_number_and_restore.py TESTLER/test_grup1_sablon_guvenlik.py
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: PETEK mask, curve, brush and viewport regressions (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q TESTLER/test_v311_manual_curve_control.py TESTLER/test_v36_viewport_undo_lighting.py TESTLER/test_v38_natural_finish.py TESTLER/test_v39_brush.py
