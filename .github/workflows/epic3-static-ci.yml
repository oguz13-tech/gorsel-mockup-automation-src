name: EPIC-3 Static CI

on:
  push:
    branches:
      - feature/epic-3-geometry-accuracy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             flask             numpy             opencv-python-headless             pillow             openpyxl             requests

      - name: Python syntax gate
        run: |
          python -m py_compile             SABLON_V2_MIMARI/core/db.py             SABLON_V2_MIMARI/core/vision.py             SABLON_V2_MIMARI/core/template_intelligence.py             SABLON_V2_MIMARI/app.py             V2_KONTROL_MERKEZI/app.py             99_SISTEM_MOTORLARI_VE_KODLAR/SISTEM_MOTORU/foreground_ai.py             99_SISTEM_MOTORLARI_VE_KODLAR/SISTEM_MOTORU/pc_master_factory.py             scripts/epic3_benchmark.py             scripts/geometry_diagnostics.py             scripts/scorer_telemetry.py             scripts/migrate_legacy_geometry_profiles.py             scripts/epic3_validation_bundle.py

      - name: Full regression suite
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest             tests/test_p0_regressions.py             tests/test_p1_p15_suite.py             tests/test_t1_client.py             tests/test_benchmark_metrics.py             tests/test_geometry_diagnostics.py             tests/test_epic3_validation_bundle.py             tests/test_epic3_benchmark.py             tests/test_control_center_file_ops.py             tests/test_runtime_workspace_routing.py             -v
