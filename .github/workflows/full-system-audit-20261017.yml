name: FULL SYSTEM AUDIT - all tests x2 (isolated checkout)
on:
  push:
    branches:
      - audit/full-system-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install complete core test dependencies
        run: python -m pip install pytest numpy opencv-python-headless pillow openpyxl requests flask psutil
      - name: Syntax compile all Python entry points
        run: python -m compileall -q .
      - name: JS syntax / Node
        run: node --check SABLON_V2_MIMARI/static/js/main.js
      - name: JS debug syntax / Node
        run: node --check debug_script.js
      - name: Full regression test suite - FIRST PASS
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: SABLON_V2_MIMARI
        run: python -m pytest -q tests
      - name: Full regression test suite - SECOND PASS
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: SABLON_V2_MIMARI
        run: python -m pytest -q tests
