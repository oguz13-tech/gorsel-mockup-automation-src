name: P0 numbering and data-loss regression
on:
  pull_request:
    paths:
      - 'SABLON_V2_MIMARI/core/template_identity.py'
      - '99_SISTEM_MOTORLARI_VE_KODLAR/SISTEM_MOTORU/**'
      - 'SABLON_DUZELTICI.py'
      - 'SABLON_V2_MIMARI/core/vision.py'
      - 'tests/test_p0_numbering_archive_stress.py'
      - 'tests/test_watcher_safety.py'
      - '.github/workflows/p0-numbering-safe-ci.yml'
  push:
    branches:
      - 'fix/p0-numbering-archive-safety-*'
jobs:
  regression:
    name: Safety tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless pillow openpyxl requests
      - name: Run P0 numbering and overwrite tests
        run: python -m pytest -q tests/test_p0_numbering_archive_stress.py tests/test_watcher_safety.py tests/test_template_identity.py tests/test_template_identity_extensions.py tests/test_p0_independent_release_safety.py tests/test_p0_review_endpoints.py
