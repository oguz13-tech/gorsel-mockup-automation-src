name: Full-system audit gate (read-only synthetic)
on:
  push:
    branches:
      - 'audit/full-system-release-gate-*'
  pull_request:
    paths:
      - 'SABLON_V2_MIMARI/**'
      - 'V2_KONTROL_MERKEZI/**'
      - '99_SISTEM_MOTORLARI_VE_KODLAR/**'
      - 'AI_Kalite_Artirici/**'
      - 'BAGIMSIZ_ARACLAR/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/epic3-full-audit.yml'
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared test runtime
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless pillow openpyxl requests flask
      - name: Check every tracked Python source for syntax errors
        run: python -m compileall -q -f .
      - name: Run ALL available pytest tests (not selected smoke tests)
        run: python -m pytest -q --disable-warnings tests
