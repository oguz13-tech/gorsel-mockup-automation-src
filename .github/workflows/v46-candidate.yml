name: V4.6 Windows candidate package
on:
  push:
    branches: [feature/v46-safe-consolidation-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install candidate dependencies
        run: python -m pip install -r MERKEZ/requirements-v46-lock.txt
      - name: Targeted code and safety tests
        run: python -m pytest -q TESTLER/test_v46_workspace_identity.py TESTLER/test_v46_inbox_identity.py TESTLER/test_v46_petek_folders_and_user_deleted.py TESTLER/test_v47_material_store_random.py TESTLER/test_v47_pause_stop_resume.py TESTLER/test_v46_review_layout.py TESTLER/test_v46_chroma_detector.py TESTLER/test_v46_chroma_batch.py TESTLER/test_v46_chroma_render.py TESTLER/test_v46_optional_4k.py TESTLER/test_v46_package.py TESTLER/test_v40_unified_seven_category.py TESTLER/test_v45_final_closure.py --junitxml=test-results.xml
      - name: Canvas angle regression
        run: node --test tests/js/test_edge_angles_v46.cjs
      - name: Build clean tracked-source ZIP
        run: python scripts/build_v46_candidate.py --output dist
      - name: Extract candidate into independent directory
        run: python -c "import pathlib,zipfile; zipfile.ZipFile(next(pathlib.Path('dist').glob('*.zip'))).extractall('zip-smoke')"
      - name: Run tests from actual extracted ZIP
        working-directory: zip-smoke/GORSEL_V46_CANDIDATE
        run: python -m pytest -q TESTLER/test_v46_workspace_identity.py TESTLER/test_v46_chroma_detector.py TESTLER/test_v46_chroma_render.py TESTLER/test_v46_optional_4k.py TESTLER/test_v47_material_store_random.py TESTLER/test_v47_pause_stop_resume.py --junitxml=zip-test-results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: V46-CANDIDATE-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            test-results.xml
            zip-smoke/GORSEL_V46_CANDIDATE/zip-test-results.xml
          if-no-files-found: error
          retention-days: 30
