name: V4.4 Group 1 source and optional 4K gate
on:
  push:
    branches:
      - feature/v44-group1-*
  pull_request:
    paths:
      - 'MERKEZ/**'
      - 'TESTLER/test_v44_group1_upscale_ui.py'
      - 'TESTLER/test_v43_finish_cloud_reapproval.py'
      - '.github/workflows/v44-group1-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group1:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy==2.4.6 opencv-python-headless==5.0.0.93 pillow openpyxl flask requests
      - name: Check syntax (does not open user data)
        run: python -m compileall -q -f MERKEZ TESTLER
      - name: Test G1 upscale, cloud Excel and geometry identity on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q TESTLER/test_v44_group1_upscale_ui.py TESTLER/test_v43_finish_cloud_reapproval.py
      - name: Install virtual display for Tk GUI smoke (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Test G1 + GUI and old tools under virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q TESTLER/test_v44_group1_upscale_ui.py TESTLER/test_v43_finish_cloud_reapproval.py TESTLER/test_v314_tk_menu.py tests/test_user_tools.py tests/test_p0_independent_release_safety.py
